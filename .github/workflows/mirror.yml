name: Mirror Banquet revocations
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: revocation-mirror
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update signed feed
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 25 --proto '=https' https://banquet-license-status.pages.dev/banquet-revocations.txt -o /tmp/banquet-revocations.txt
          grep -Eq '^BQR1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$' /tmp/banquet-revocations.txt
          cp /tmp/banquet-revocations.txt banquet-revocations.txt
          git diff --quiet && exit 0
          git config user.name 'Banquet release automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add banquet-revocations.txt
          git commit -m 'Mirror signed Banquet revocations'
          git push
